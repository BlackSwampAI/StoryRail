name: OpenWiki Update

on:
  push:
    branches:
      - main
    paths-ignore:
      - "openwiki/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".github/workflows/openwiki-update.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: true
          # Full history lets OpenWiki diff HEAD against the commit it last documented.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install OpenWiki
        # Keep OpenWiki's LangChain peers on the last known-compatible release set.
        run: npm install --global openwiki@0.3.2 langchain@1.5.6 @langchain/core@1.2.6 mermaid@11.16.0 jsdom@29.1.1

      - name: Verify OpenWiki startup
        run: openwiki --help

      - name: Run OpenWiki
        run: openwiki code --update --print
        env:
          OPENWIKI_PROVIDER: openrouter
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENWIKI_MODEL_ID: z-ai/glm-5.2

      - name: Create OpenWiki update pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          add-paths: |
            openwiki
            AGENTS.md
            CLAUDE.md
            .github/workflows/openwiki-update.yml
          branch: openwiki/update
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: |
            Automated OpenWiki documentation update.

            This PR refreshes StoryRail's generated repository documentation after changes landed on `main`.

            Review generated documentation for accuracy before merging.
